<!doctype html>
<html lang="de">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fitness">
<title>Fitness</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>

  <symbol id="i-flame" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2s4.6 3.9 4.6 8.3a4.6 4.6 0 0 1-9.2 0c0-1.3.5-2.5 1.2-3.4.3 1 1 1.9 1.8 1.9 1.3 0 1.6-1.5 1.6-3.1z"/></g></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4.5L4 7.5l3 3M4 7.5h13M17 13.5l3 3-3 3M20 16.5H7"/></g></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l1.8 5.2 5.2 1.8-5.2 1.8L12 17.5l-1.8-5.2-5.2-1.8 5.2-1.8zM18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></g></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-4v-6h-5v6h-4A1.5 1.5 0 0 1 4 19z"/></g></symbol>

<div class="app">
  <nav id="nav" aria-label="Bereiche">
    <a href="#heute" data-tab="heute"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg><span>Heute</span></a>
    <a href="#training" data-tab="training"><svg class="icon" aria-hidden="true"><use href="#i-dumbbell"/></svg><span>Training</span><b class="count dot" hidden></b></a>
    <a href="#ernaehrung" data-tab="ernaehrung"><svg class="icon" aria-hidden="true"><use href="#i-food"/></svg><span>Ernährung</span></a>
    <a href="#fortschritt" data-tab="fortschritt"><svg class="icon" aria-hidden="true"><use href="#i-progress"/></svg><span>Fortschritt</span></a>
    <a href="#profil" data-tab="profil"><svg class="icon" aria-hidden="true"><use href="#i-user"/></svg><span>Profil</span></a>
  </nav>

  <div class="content">
    <header class="topbar">
      <h1 id="pageTitle">Heute</h1>
      <button type="button" id="profileBtn" class="profile-btn" aria-label="Profil wechseln">
        <span class="dot" id="profileDot" style="--c:var(--accent)"></span><span id="profileName">…</span>
      </button>
    </header>
    <div id="banner" class="banner" hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-cloud"/></svg>
      <span id="bannerText"></span>
      <button type="button" class="link-btn" id="bannerAction" hidden></button>
    </div>
    <main>
      <section id="view-heute" class="view" hidden></section>
      <section id="view-training" class="view" hidden></section>
      <section id="view-ernaehrung" class="view" hidden></section>
      <section id="view-fortschritt" class="view" hidden></section>
      <section id="view-profil" class="view" hidden></section>
    </main>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
